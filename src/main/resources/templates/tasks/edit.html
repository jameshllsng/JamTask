<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar tarefa</title>
</head>

<body>

  <h1>Editar tarefa</h1>

  <form th:action="@{/tasks/{id}(id=${task.id})}" method="post">

    <label for="title">Título</label>
    <input type="text" id="title" name="title" th:value="${task.title}" required>

    <label for="description">Descrição</label>
    <textarea id="description" name="description" th:text="${task.description}"></textarea>

    <label for="status">Status</label>
    <select id="status" name="status">
      <option value="PENDING" th:selected="${task.status.name() == 'PENDING'}">
        Pendente
      </option>
      <option value="IN_PROGRESS" th:selected="${task.status.name() == 'IN_PROGRESS'}">
        Em andamento
      </option>
      <option value="COMPLETED" th:selected="${task.status.name() == 'COMPLETED'}">
        Concluída
      </option>
    </select>

    <label for="dueDate">Data</label>
    <input type="date" id="dueDate" name="dueDate" th:value="${task.dueDate}">

    <button type="submit">Atualizar</button>
  </form>

</body>

</html>
